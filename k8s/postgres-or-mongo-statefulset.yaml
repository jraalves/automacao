# Demonstração — camada de dados: o arquivo que explica a troca de engine.
#
# O caso original usou MongoDB: cada documento fiscal virava um documento JSON
# com índice por (empresa, mês de referência) e a trilha de auditoria como
# subdocumentos. Este arquivo não publica schema original nenhum. Ele documenta
# duas coisas:
#
#   1. como a mesma camada ficaria em Postgres (StatefulSet + VolumeClaimTemplate),
#      que é o desenho que eu defendo hoje para esse volume de dados;
#   2. por que a troca é um problema de *padrão de acesso*, não de nome de tabela.
#
# Motivos concretos para trocar de engine neste tipo de aplicação (independentes
# de fornecedor):
#   * a consulta da interface é "empresa + mês + status + paginação": índice
#     composto banal em Postgres, e que virava varredura completa quando alguém
#     criava um filtro novo (incidente INC-DEMO-04 da demonstração);
#   * a trilha de auditoria quer transação junto com a publicação, não escrita
#     eventual;
#   * retenção e particionamento por mês ficam mais previsíveis com partições
#     declarativas do que com coleções nomeadas na mão.
#
# Imagem, Secret e storage class precisam ser os do SEU cluster: abaixo só há
# placeholder e o namespace da demonstração.
#
#   kubectl apply -f k8s/postgres-or-mongo-statefulset.yaml
#   kubectl -n automacao-demo rollout status statefulset/automacao-dados
apiVersion: v1
kind: Service
metadata:
  name: automacao-dados
  namespace: automacao-demo
  labels:
    app.kubernetes.io/name: automacao-dados
    app.kubernetes.io/component: dados
    app.kubernetes.io/part-of: automacao-fiscal
    team.sre.io/observabilidade: habilitado
spec:
  # Headless de propósito: quem fala com a camada de dados usa o DNS por réplica,
  # não um ClusterIP que esconde atrás de um pool qual nó atendeu o pedido.
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: automacao-dados
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: automacao-dados
  namespace: automacao-demo
  labels:
    app.kubernetes.io/name: automacao-dados
    app.kubernetes.io/component: dados
    app.kubernetes.io/part-of: automacao-fiscal
    demonstracao/geracao: sintetica
spec:
  serviceName: automacao-dados
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: automacao-dados
  template:
    metadata:
      labels:
        app.kubernetes.io/name: automacao-dados
        app.kubernetes.io/component: dados
      annotations:
        demonstracao/geracao: sintetica
    spec:
      serviceAccountName: automacao-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Espelhe a imagem oficial no registry do seu cluster. O sufixo -SINT
          # marca que este manifest é de demonstração: o tools/validate.py exige
          # esse sufixo em todo campo image: versionado aqui.
          image: registry.example.com/automacao/postgres:16-SINT
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: automacao-demo-credenciais
                  key: postgres_senha
            - name: POSTGRES_DB
              value: automacao_demo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          startupProbe:
            tcpSocket:
              port: postgres
            failureThreshold: 12
            periodSeconds: 5
        - name: exporter
          # O SLI de disponibilidade da busca depende de enxergar a camada de
          # dados: sem métrica de conexão e de espaço, o alerta de cobertura fica
          # cego para o motivo de atraso mais frequente.
          image: registry.example.com/automacao/postgres-exporter:0.15-SINT
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: automacao-demo-credenciais
                  key: postgres_uri_leitura
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: runtime
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: dados
        labels:
          demonstracao/geracao: sintetica
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 40Gi
