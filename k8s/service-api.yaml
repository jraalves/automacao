# Demonstração — Service da API de busca fiscal.
#
# Decisão registrada em docs/decisoes/0001-...: o Service é ClusterIP e NUNCA é
# publicado. Quem expõe algo para a rua é o Ingress, sempre atrás do oauth2-proxy.
#
#   kubectl apply -f k8s/service-api.yaml
apiVersion: v1
kind: Service
metadata:
  name: automacao-api
  namespace: automacao-demo
  labels:
    app.kubernetes.io/name: automacao-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: automacao-fiscal
    team.sre.io/observabilidade: habilitado
spec:
  type: ClusterIP
  # sessionAffion None: qualquer réplica serve qualquer busca; o estado do pedido
  # mora no Mongo, não na memória do pod.
  sessionAffinity: None
  selector:
    app.kubernetes.io/name: automacao-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: otlp-metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
---
# Service headless dos workers: as requisições HTTP não passam por aqui; ele só
# existe para o Collector (e um futuro scrape de métricas por pod) descobrir as
# réplicas pelo DNS.
apiVersion: v1
kind: Service
metadata:
  name: automacao-worker
  namespace: automacao-demo
  labels:
    app.kubernetes.io/name: automacao-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: automacao-fiscal
    team.sre.io/observabilidade: habilitado
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: automacao-worker
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
