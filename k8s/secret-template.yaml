# Demonstração — MODELO de Secret. Todos os valores são placeholder.
#
# Este arquivo nunca deve receber valor real. Num cluster de verdade, o Secret é
# criado por fora do repositório (Sealed Secrets, External Secrets, Vault ou
# `kubectl create secret` na mão) e só o NOME aparece nos manifests.
#
# Como usar o modelo sem vazar nada:
#   cp k8s/secret-template.yaml /tmp/secret-local.yaml   # fora do repositório
#   # edite /tmp/secret-local.yaml com valores do SEU cluster de teste
#   kubectl apply -f /tmp/secret-local.yaml
#   rm /tmp/secret-local.yaml
#
# Verificação de que nada real foi commitado: tools/leak_check.py (roda no CI).
apiVersion: v1
kind: Secret
metadata:
  name: automacao-demo-credenciais
  namespace: automacao-demo
  labels:
    app.kubernetes.io/name: automacao-demo
    demonstracao/geracao: sintetica
type: Opaque
stringData:
  # String de conexão do Mongo. Formato, não valor.
  mongo_uri: "<CHANGE_ME>"
  # Chaves do desenho alternativo com Postgres
  # (k8s/postgres-or-mongo-statefulset.yaml). Mesma regra: placeholder sempre.
  postgres_senha: "<CHANGE_ME>"
  postgres_uri_leitura: "<CHANGE_ME>"
  # Cliente do IdP usado pelo oauth2-proxy.
  oauth2_client_id: "<CHANGE_ME>"
  oauth2_client_secret: "<CHANGE_ME>"
  oauth2_cookie_secret: "<CHANGE_ME>"
---
# Credencial do conector com o repositório de arquivos corporativo (M365
# Drive-like, genérico). Montada no worker em readOnly: true, modo 0400.
apiVersion: v1
kind: Secret
metadata:
  name: automacao-repositorio-credenciais
  namespace: automacao-demo
  labels:
    app.kubernetes.io/name: automacao-worker
    demonstracao/geracao: sintetica
type: Opaque
stringData:
  # Arquivo lido pelo conector (REPOSITORIO_CREDENCIAIS_ARQUIVO). Formato
  # ilustrativo: nada aqui corresponde a tenant, aplicação ou usuário real.
  repositorio.json: |
    {
      "autoridade": "https://login.example.com/<TENANT_ID>",
      "cliente_id": "<CHANGE_ME>",
      "cliente_secreto": "<CHANGE_ME>",
      "escopo": "Arquivos.ReadWrite",
      "raiz": "/Demonstracao-Fiscal"
    }
---
# Certificados do Ingress: criados por cert-manager ou importados à mão. O nome
# é o que o ingress.yaml referencia; o conteúdo jamais entra no repositório.
apiVersion: v1
kind: Secret
metadata:
  name: automacao-demo-tls
  namespace: automacao-demo
  labels:
    demonstracao/geracao: sintetica
type: kubernetes.io/tls
data:
  # Base64 de certificado e chave REAIS não entram aqui. Deixe vazio e use um
  # emissor de certificado (cert-manager) ou crie o Secret fora do Git.
  tls.crt: ""
  tls.key: ""
