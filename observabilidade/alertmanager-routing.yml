# Demonstração — roteamento, agrupamento, inibição e silêncio de alertas.
#
# Ideia do desenho: a mesma queima vira três conversas diferentes.
#   queima 1 h  >= 14,4x  -> S1 -> página (alguém acorda)
#   queima 6 h  >=  6,0x  -> S2 -> ticket com prazo (alguém olha hoje)
#   queima 24 h >=  1,0x  -> S3 -> lista de revisão semanal (decisão de orçamento)
# Os três limiares são os mesmos de observabilidade/prometheus-rules.yml e do
# bloco error_budget.limiares gerado por tools/gen_data.py.
#
# Nada aqui tem credencial: o Alertmanager aponta para um webhook dentro do
# cluster (nome de Service, sem domínio externo) e para um e-mail de exemplo. Em
# produção, o token do notificador fica em Secret e é montado por fora do Git —
# mesmo padrão de k8s/secret-template.yaml.
#
# Validação estrutural: tools/validate.py. Teste de rota com dados sintéticos:
#   amtool check-config observabilidade/alertmanager-routing.yml
#   amtool config routes --config.file=observabilidade/alertmanager-routing.yml

global:
  resolve_timeout: 5m

time_intervals:
  - name: expediente
    time_intervals:
      - times:
          - start_time: "09:00"
            end_time: "18:00"
        location: America/Sao_Paulo
  - name: madrugada
    time_intervals:
      - times:
          - start_time: "23:00"
            end_time: "07:00"
        location: America/Sao_Paulo

inhibit_rules:
  # Um S1 aberto no mesmo SLI engole os S2/S3 daquele SLI: a página já inclui o
  # contexto, e o ticket duplicado só produz fadiga de alerta.
  - source_matchers:
      - severity = "S1"
    target_matchers:
      - severity =~ "S2|S3"
    equal:
      - sli
      - namespace
  # Alerta de telemetria (série sumida, Collector mudo) inibe alertas de SLI
  # derivados: sem dado, queima calculada em cima de série parcial é ruído.
  - source_matchers:
      - sli = "telemetria"
    target_matchers:
      - sli =~ "cobertura_fiscal|taxa_erro_worker|disponibilidade_busca|latencia_extracao"
    equal:
      - namespace

route:
  receiver: ticket-sre
  group_by:
    - alertname
    - sli
    - equipe
  group_wait: 45s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: pagina-sre
      matchers:
        - severity = "S1"
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 30m
      # S1 não silencia de madrugada: é exatamente para isso que ele é S1.

    - receiver: ticket-sre
      matchers:
        - severity = "S2"
      group_interval: 10m
      repeat_interval: 6h

    - receiver: revisao-de-orcamento
      matchers:
        - severity = "S3"
      group_interval: 30m
      repeat_interval: 24h
      # Revisão de orçamento não precisa chegar de noite nem no fim de semana.
      active_time_intervals:
        - expediente

    - receiver: telemetria-sem-dado
      matchers:
        - sli = "telemetria"
      group_wait: 1m
      repeat_interval: 3h

    - receiver: descarte-demo
      matchers:
        - ambiente != "demonstracao"
      # Rede de segurança: este repo é de demonstração. Se um alerta sem o
      # rótulo da demo aparecer aqui, ele não vira página de ninguém.
      continue: false

receivers:
  - name: pagina-sre
    webhook_configs:
      - url: http://alerta-notificador.automacao-demo.svc.cluster.local:8080/pagina
        send_resolved: true
      - url: http://alerta-notificador.automacao-demo.svc.cluster.local:8080/mesa
        send_resolved: true
    # Em produção, o telefone/e-mail de quem está de plantão vem de um arquivo
    # gerenciado fora do Git. Nada de número real neste repositório.

  - name: ticket-sre
    webhook_configs:
      - url: http://alerta-notificador.automacao-demo.svc.cluster.local:8080/ticket
        send_resolved: true

  - name: revisao-de-orcamento
    webhook_configs:
      - url: http://alerta-notificador.automacao-demo.svc.cluster.local:8080/lista
        send_resolved: true

  - name: telemetria-sem-dado
    webhook_configs:
      - url: http://alerta-notificador.automacao-demo.svc.cluster.local:8080/plataforma
        send_resolved: true

  - name: descarte-demo
    webhook_configs:
      - url: http://alerta-notificador.automacao-demo.svc.cluster.local:8080/descarte
        send_resolved: true
